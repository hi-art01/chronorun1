<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mana Brawl</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="selection-screen">
        <h1>Select Your Fighter</h1>
        <div class="selection-container">
            <div class="player-select" id="p1-select">
                <h2>Player 1</h2>
                <div class="char-btn" data-char="Priest">Priest</div>
                <div class="char-btn" data-char="Devil">Devil</div>
                <div class="char-btn" data-char="Fighter">Fighter</div>
                <div class="char-btn" data-char="Mage">Mage</div>
                <div class="char-info" id="p1-info"></div>
                <div class="status">Waiting...</div>
            </div>
            <div class="player-select" id="p2-select">
                <h2>Player 2</h2>
                <div class="char-btn" data-char="Priest">Priest</div>
                <div class="char-btn" data-char="Devil">Devil</div>
                <div class="char-btn" data-char="Fighter">Fighter</div>
                <div class="char-btn" data-char="Mage">Mage</div>
                <div class="char-info" id="p2-info"></div>
                <div class="status">Waiting...</div>
            </div>
        </div>
        <button id="start-btn" disabled>Start Fight</button>
    </div>

    <div id="game-container" style="display: none;">
        <div id="ui-layer">
            <div class="player-hud" id="p1-hud">
                <div class="name">Player 1</div>
                <div class="bar-container health">
                    <div class="bar-fill" id="p1-health" style="width: 100%;"></div>
                </div>
                <div class="bar-container mana">
                    <div class="bar-fill" id="p1-mana" style="width: 0%;"></div>
                </div>
            </div>
            <div class="player-hud" id="p2-hud">
                <div class="name">Player 2</div>
                <div class="bar-container health">
                    <div class="bar-fill" id="p2-health" style="width: 100%;"></div>
                </div>
                <div class="bar-container mana">
                    <div class="bar-fill" id="p2-mana" style="width: 0%;"></div>
                </div>
            </div>
            <div id="message-area"></div>
        </div>
        <canvas id="gameCanvas" width="1000" height="700"></canvas>
        <div id="game-over" style="display: none;">
            <h1 id="winner-text">Player 1 Wins!</h1>
            <button onclick="location.reload()">Play Again</button>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/input.js"></script>
    <script src="js/projectile.js"></script>
    <script src="js/character.js"></script>
    <script src="js/characters/priest.js"></script>
    <script src="js/characters/devil.js"></script>
    <script src="js/characters/fighter.js"></script>
    <script src="js/characters/mage.js"></script>
    <script src="js/game.js"></script>
    <script src="js/main.js"></script>
</body>

</html>
