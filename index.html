<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ChronoRun — Scorpion & Cyclops — Melee Hitbox + Strong Melee</title>
  <style>
    :root {
      --bg: #0b1420;
      --panel: #081827cc;
      --accent: #7dd3fc
    }

    html,
    body {
      height: 100%;
      margin: 0;
      background: var(--bg);
      font-family: system-ui, Segoe UI, Roboto, Arial;
      color: #e6eef6
    }

    #gameWrap {
      position: relative;
      height: 100vh;
      overflow: hidden
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%
    }

    #hud {
      position: fixed;
      right: 12px;
      top: 12px;
      background: rgba(0, 0, 0, 0.6);
      padding: 10px 12px;
      border-radius: 10px;
      font-family: monospace;
      color: #eaf6ff;
      font-size: 14px;
      line-height: 1.4;
      min-width: 220px;
    }

    #shopOverlay {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      background: #0b2430;
      padding: 18px;
      border-radius: 12px;
      display: none;
      width: 520px;
      max-width: 92vw;
      color: #eaf6ff;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.6)
    }

    #shopContent {
      background: #1e293b;
      padding: 24px;
      border-radius: 8px;
      width: 100%;
      max-width: 500px;
      text-align: left;
      position: relative;
      max-height: 80vh;
      overflow-y: auto;
    }

    .shop-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.03)
    }

    button.btn {
      background: linear-gradient(#0b72a1, #065a85);
      color: white;
      border: none;
      padding: 8px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 700
    }

    .muted {
      color: #9aa7b2;
      font-size: 13px
    }

    h2 {
      margin: 0 0 8px 0
    }
  </style>
</head>

<body>
  <div id="gameWrap">
    <canvas id="c"></canvas>
    <div id="hud" aria-live="polite"></div>

    <div id="shopOverlay" role="dialog" aria-hidden="true">
      <h2>Shop — Permanent Purchases & Time</h2>
      <div id="shopContent"></div>
      <div style="margin-top:12px;display:flex;gap:8px;justify-content:flex-end">
        <button id="shopClose" class="btn">Close & Start Run</button>
      </div>
    </div>
  </div>

  <script>
    /* ChronoRun — Full single-file
       - Melee weapons much stronger (approx. ~1/3 Cyclops HP per hit for swords).
       - Temporary hitbox rectangle (200 ms) shows melee range when attacking.
       - Attack with Left Click or '.' (period) key.
       - Session-only progression (resets on reload). Shop purchases are permanent for session and auto-equip.
       - Graphics/sprite filenames unchanged.
    */

    // ---------- CANVAS ----------
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    function resize() { canvas.width = innerWidth; canvas.height = innerHeight; }
    addEventListener('resize', resize);
    resize();

    // ---------- CONFIG ----------
    const SAMPLE_W = 32;
    const CHUNK_SAMPLES = 120;
    const WORLD_BUFFER_AHEAD = 1400;
    const WORLD_BUFFER_BEHIND = 1400;
    const GRAVITY = 0.9;
    const JUMP_V = -14;
    const START_TIME_SECONDS = 60;
    const MAX_TIME_SECONDS = 300;
    const PACE_MAX_SECONDS = 20;
    const CYCL_TRACK_MS = 1200;
    const CYCL_LOCK_MS = 450;
    const CYCL_COOLDOWN_MS = 2200;
    const SCALE = 1.35;

    // ---------- IN-MEMORY SAVE (resets on reload) ----------
    let save = {
      permWeapons: [],              // permanently unlocked weapons this session
      unlockedDungeonWeapons: [],  // discovered weapons this session
      points: 0,                   // canonical currency (session)
      permSpeed: 0,
      runs: 0,
      equipped: 'Stick',
      timePurchase: 0,
      timePenaltyReduction: 0,
      timePurchaseCount: 0
    };

    // ---------- SPRITES ----------
    const SPRITE_FILES = {
      idleright: 'idleright.png', idleleft: 'idleleft.png',
      jumpwalk1: 'jumpwalk1.png', jumpwalk1left: 'jumpwalk1left.png',
      jump2: 'jump2.png', jump2left: 'jump2left.png',
      jump3: 'jump3.png', jump3left: 'jump3left.png',
      scorpionright: 'scorpionright.png', scorpionleft: 'scorpionleft.png',
      cyclopsright: 'cyclopsright.png', cyclopsleft: 'cyclopsleft.png'
    };
    const SPRITES = {};
    for (const k in SPRITE_FILES) {
      const img = new Image();
      img.src = SPRITE_FILES[k];
      img.onload = () => { SPRITES[k] = img; };
      img.onerror = () => { SPRITES[k] = null; };
    }

    // ---------- GAME STATE ----------
    let cameraX = 0;
    let terrain = [];
    let platforms = [];
    let dungeons = [];
    let enemies = [];
    let cyclopses = [];
    let projectiles = [];
    let items = [];
    let chunks = [];

    let points = save.points || 0;
    let timerSeconds = START_TIME_SECONDS + (save.timePurchase || 0);
    let runActive = false;
    let paused = false;
    let lastEncounterTime = performance.now();
    let frameCount = 0;

    // Hitbox visual (shown briefly when melee attack happens)
    let lastMeleeHitbox = null; // {x, y, w, h, expiresAt}

    // ---------- PLAYER ----------
    const PLAYER = {
      x: 500, y: 0, w: Math.round(40 * SCALE), h: Math.round(56 * SCALE), vy: 0, speed: 3.2, onGround: true,
      facing: 'right', state: 'idle', animTimer: 0, animFrame: 0,
      inventory: [], slot: 0,
      equipped: save.equipped || 'Stick',
      maxJumps: 1, jumpsLeft: 0
    };

    // ---------- INPUT ----------
    const keys = {};
    addEventListener('keydown', e => {
      const k = e.key.toLowerCase();
      keys[k] = true;
      if ([' ', 'arrowup', 'arrowdown', 'arrowleft', 'arrowright', 'w', 'a', 's', 'd', '.'].includes(k)) e.preventDefault();
      // allow '.' to trigger immediately (key hold will be handled by cooldown)
      if (k === '.') playerAttack();
    });
    addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

    canvas.addEventListener('mousedown', (ev) => {
      if (ev.button === 0) { playerAttack(); }
    });

    // ---------- UTIL ----------
    function rand(a, b) { return Math.random() * (b - a) + a; }
    function rint(a, b) { return Math.floor(rand(a, b + 1)); }
    function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
    function fmtTime(s) { const m = Math.floor(s / 60); const sec = Math.floor(s % 60); return `${String(m).padStart(2, '0')}:${String(sec).padStart(2, '0')}`; }

    // ---------- TERRAIN STREAM ----------
    let generatedXEnd = 0;
    let generatedXStart = 0;
    function ensureTerrainAroundCamera() {
      const center = PLAYER.x;
      const needRight = center + WORLD_BUFFER_AHEAD;
      const needLeft = center - WORLD_BUFFER_BEHIND;
      while (generatedXEnd < needRight) {
        generateChunk(generatedXEnd);
        generatedXEnd += CHUNK_SAMPLES * SAMPLE_W;
      }
      while (generatedXStart > needLeft) {
        generatedXStart -= CHUNK_SAMPLES * SAMPLE_W;
        generateChunk(generatedXStart);
      }
    }
    function generateChunk(startX) {
      if (chunks.some(ch => ch.start === startX)) return;
      const segLen = CHUNK_SAMPLES;
      const biomeChoices = ['grass', 'grass', 'desert', 'snow', 'mountain', 'grass', 'volcano'];
      const biome = biomeChoices[rint(0, biomeChoices.length - 1)];
      let base;
      if (biome === 'grass') base = canvas.height - 120;
      else if (biome === 'desert') base = canvas.height - 140;
      else if (biome === 'snow') base = canvas.height - 180;
      else if (biome === 'mountain') base = canvas.height - 260;
      else base = canvas.height - 140;

      for (let i = 0; i < segLen; i++) {
        const px = startX + i * SAMPLE_W;
        let noise = 0;
        if (biome === 'grass') noise = Math.sin((px) / 120) * 18 + rand(-6, 6);
        else if (biome === 'desert') noise = Math.sin(px / 180) * 10 + rand(-6, 6);
        else if (biome === 'snow') noise = Math.sin(px / 90) * 28 + rand(-10, 10);
        else if (biome === 'mountain') noise = Math.sin(px / 70) * 80 + rand(-18, 18);
        else if (biome === 'volcano') noise = Math.sin(px / 150) * 20 + rand(-12, 12);
        const y = clamp(Math.round(base + noise), 80, canvas.height - 80);
        terrain.push({ x: px, y });
        if (biome === 'mountain' && Math.random() < 0.06 && i % 6 === 0) {
          const pw = rint(80, 160), pxpos = px + rint(-20, 20), pypos = y - rint(120, 260);
          platforms.push({ x: pxpos, y: pypos, w: pw, h: 10 });
        }
        if (Math.random() < 0.012 && i > 6) {
          const dx = px + rint(60, SAMPLE_W * 3);
          dungeons.push({ x: dx, y: y - 56, w: 80, h: 56, weapon: chooseDungeonWeapon(), opened: false });
        }
        if (Math.random() < 0.035) {
          const ex = px + rint(40, SAMPLE_W);
          const ey = y - 10;
          spawnEnemy('Scorpion', ex, ey);
        }
        if (Math.random() < 0.018 && biome === 'mountain') {
          const cx = px + rint(120, SAMPLE_W * 6);
          const cy = y - rint(40, 120);
          spawnCyclopsAt(cx, cy, true);
        } else if (Math.random() < 0.006) {
          const cx2 = px + rint(120, SAMPLE_W * 6);
          const cy2 = y - rint(30, 90);
          spawnCyclopsAt(cx2, cy2, false);
        }
      }
      chunks.push({ start: startX, len: segLen * SAMPLE_W, biome });
      terrain.sort((a, b) => a.x - b.x);
    }

    // ---------- ENEMIES ----------
    const ENEMY_DEFS = {
      Scorpion: { w: Math.round(34 * SCALE), h: Math.round(22 * SCALE), color: '#c38b3c', hp: 12, speed: 2.4, timePenalty: 7, reward: 22 },
      Cyclops: { w: Math.round(92 * SCALE), h: Math.round(92 * SCALE), color: '#9a8f8f', hp: 90, speed: 0.14, timePenalty: 14, reward: 360 }
    };
    function chooseEnemyForBiome(b) { return 'Scorpion'; }
    function spawnEnemy(type, x, y) {
      const def = ENEMY_DEFS[type] || ENEMY_DEFS.Scorpion;
      enemies.push({
        type, x, y, vx: 0, vy: 0, w: def.w, h: def.h, hp: def.hp, maxHp: def.hp, color: def.color, speed: def.speed,
        timePenalty: def.timePenalty, reward: def.reward, ai: 0, id: type + '_' + Date.now() + '_' + Math.random(),
        facing: (x > PLAYER.x) ? 'left' : 'right'
      });
    }
    function spawnCyclopsAt(x, y, inMountain = false) {
      const def = ENEMY_DEFS.Cyclops;
      cyclopses.push({
        x, y, hp: def.hp, maxHp: def.hp, state: 'idle', stateStart: performance.now(), target: null, inMountain: !!inMountain,
        id: 'cycl_' + Date.now() + '_' + Math.random(), lastFired: 0, facing: (x > PLAYER.x) ? 'left' : 'right'
      });
    }

    // ---------- PICKUPS / DUNGEONS ----------
    function chooseDungeonWeapon() { const pool = ['Wooden Sword', 'Iron Sword', 'Ice Dagger', 'Great Axe', 'Fire Staff', 'Laser Wand', 'Magic Wand', 'Bow']; return pool[rint(0, pool.length - 1)]; }

    function pickUpItemWorld(it) {
      if (it.type === 'money') { awardPoints(it.amount); }
      else if (it.type === 'dungeon-weapon' && !it.claimed) {
        it.claimed = true;
        if (!save.unlockedDungeonWeapons.includes(it.name)) {
          save.unlockedDungeonWeapons.push(it.name);
          addToInventory({ name: it.name, type: 'weapon', fromDungeon: true });
        }
        awardPoints(30);
      }
    }

    function addToInventory(item) {
      if (!item) return;
      PLAYER.inventory.push(item);
      if (PLAYER.inventory.length > 3) PLAYER.inventory.shift();
      if (item.type === 'weapon') {
        if (!save.unlockedDungeonWeapons.includes(item.name)) save.unlockedDungeonWeapons.push(item.name);
      }
    }

    function awardPoints(n) {
      points += n;
      save.points = points;
    }

    // ---------- WEAPONS (MELEE TUNED STRONGER) ----------
    const WEAPONS = {
      // Melee: tuned strong (around 1/3 Cyclops HP per hit for swords)
      'Stick': { dmg: 8, range: 36, cd: 12, projectile: false },
      'Wooden Sword': { dmg: 30, range: 64, cd: 18, projectile: false },
      'Iron Sword': { dmg: 36, range: 74, cd: 18, projectile: false },
      'Ice Dagger': { dmg: 26, range: 40, cd: 10, projectile: false },
      'Great Axe': { dmg: 48, range: 56, cd: 32, projectile: false },
      // Ranged generic
      'Bow': { dmg: 10, range: 340, cd: 22, projectile: true, speed: 10, color: '#fff' },
      'Magic Wand': { dmg: 12, range: 360, cd: 26, projectile: true, speed: 9, color: '#aaf' },
      'Fire Staff': { dmg: 16, range: 360, cd: 30, projectile: true, speed: 8, color: '#f84' },
      'Laser Wand': { dmg: 18, range: 700, cd: 28, projectile: true, speed: 16, color: '#f0f' },

      // UNIQUE WEAPONS
      'Crimson Dagger': { dmg: 35, range: 56, cd: 14, projectile: false, special: 'lifesteal' }, // Melee lifesteal
      'Frost Wand': { dmg: 14, range: 400, cd: 24, projectile: true, speed: 9, color: '#0ff', special: 'freeze' },
      'Phoenix Staff': { dmg: 24, range: 450, cd: 40, projectile: true, speed: 8, color: '#fa0', special: 'explode' },
      'Void Cannon': { dmg: 30, range: 600, cd: 50, projectile: true, speed: 12, color: '#80f', special: 'pierce' },
      'Storm Caller': { dmg: 12, range: 400, cd: 36, projectile: true, speed: 14, color: '#ff0', count: 3, spread: 0.25 },
      'Necromancer Staff': { dmg: 20, range: 600, cd: 60, projectile: false, special: 'summon' }
    };
    let attackCooldown = 0;

    // Attack now triggers a visible hitbox for melee for 200ms
    function playerAttack() {
      const eq = PLAYER.inventory[PLAYER.slot] ? PLAYER.inventory[PLAYER.slot].name : (PLAYER.equipped || 'Stick');
      // Handle randomized/prefixed names by finding the base match? 
      // For now, assume exact match or fail back to stick if complex name not in map.
      // Actually, we are generating names like "Mythic Void Cannon". We need to look up by suffix if full name fails.
      let w = WEAPONS[eq];
      if (!w) {
        // Try to find base name suffix
        const base = Object.keys(WEAPONS).find(k => eq.endsWith(k));
        w = WEAPONS[base] || WEAPONS['Stick'];
      }

      if (attackCooldown > 0) return;
      attackCooldown = w.cd;

      if (w.special === 'summon') {
        // SUMMON LOGIC
        minions.push({
          x: PLAYER.x, y: PLAYER.y - 10,
          type: 'minion_scorpion',
          hp: 60, maxHp: 60, life: 1200, // 20 seconds approx
          facing: PLAYER.facing,
          state: 'idle', target: null, attackCd: 0,
          w: Math.round(34 * SCALE), h: Math.round(22 * SCALE)
        });
        // Visual feedback
        projectiles.push({ type: 'explosion', x: PLAYER.x, y: PLAYER.y - 20, radius: 30, life: 5, color: '#4a9' });
        return;
      }

      const dir = PLAYER.facing === 'left' ? -1 : 1;
      const count = w.count || 1;
      const spread = w.spread || 0;

      if (w.projectile) {
        for (let i = 0; i < count; i++) {
          const angleOffset = (count > 1) ? (-spread / 2 + (spread / (count - 1)) * i) : 0;
          // Simple vy component based on angle
          const vxBase = (w.speed || 10);
          const vx = Math.cos(angleOffset) * vxBase * dir;
          const vy = Math.sin(angleOffset) * vxBase; // vy is independent of facing direction for spread

          projectiles.push({
            x: PLAYER.x + dir * 36, y: PLAYER.y - 12,
            vx: vx, vy: vy,
            dmg: w.dmg, life: w.range,
            owner: 'player', type: 'projectile',
            special: w.special, color: w.color || '#fff',
            hitList: [] // for piercing
          });
        }
      } else {
        // melee
        const hx = PLAYER.x + (dir > 0 ? 0 : -w.range);
        const hw = w.range;
        const hy = PLAYER.y - PLAYER.h / 2;
        const hh = PLAYER.h;
        lastMeleeHitbox = { x: hx, y: hy, w: hw, h: hh, expiresAt: performance.now() + 200 };

        // Apply damage
        const hitTarget = (target) => {
          target.hp -= (w.dmg + rint(-2, 2));
          if (w.special === 'lifesteal') timerSeconds = Math.min(START_TIME_SECONDS + (save.timePurchase || 0), timerSeconds + 1);
          if (target.hp <= 0) return true;
          return false;
        };

        enemies.slice().forEach(e => {
          if (rectIntersect(hx, hy, hw, hh, e.x - e.w / 2, e.y - e.h, e.w, e.h)) {
            if (hitTarget(e)) onEnemyKill(e);
            lastEncounterTime = performance.now();
          }
        });
        cyclopses.slice().forEach(c => {
          const cw = ENEMY_DEFS.Cyclops.w, ch = ENEMY_DEFS.Cyclops.h;
          if (rectIntersect(hx, hy, hw, hh, c.x - cw / 2, c.y - ch / 2, cw, ch)) {
            if (hitTarget(c)) onCyclopsKill(c);
            lastEncounterTime = performance.now();
          }
        });
      }
    }
    function rectIntersect(x1, y1, w1, h1, x2, y2, w2, h2) {
      return !(x2 > x1 + w1 || x2 + w2 < x1 || y2 > y1 + h1 || y2 + h2 < y1);
    }

    // projectile updates
    function updateProjectiles(dt) {
      projectiles.slice().forEach(p => {
        p.x += (p.vx || 0) * (dt / 16);
        p.y += (p.vy || 0) * (dt / 16);
        // Fix: Handle undefined vx/vy for Visual projectiles (trails) to avoid NaN
        const speed = Math.hypot(p.vx || 0, p.vy || 0);
        p.life = (p.life === undefined) ? 99999 : p.life - speed * (dt / 16);

        if (p.owner === 'player') {
          const processHit = (target, isCyclops) => {
            // Piercing logic: if already hit this target, skip
            if (p.special === 'pierce' && p.hitList.includes(target.id)) return false;

            if (p.special === 'explode') {
              // Area damage, then destroy projectile
              createExplosion(p.x, p.y, 100, p.dmg);
              return true;
            }

            let dmg = p.dmg;
            target.hp -= dmg;

            if (p.special === 'freeze') {
              // Apply slow effect
              target.speed = (target.originalSpeed || target.speed) * 0.5;
              // For a temporary freeze, we'd need a timer on the enemy, but for now, a permanent slow.
            }
            if (p.special === 'lifesteal') {
              // Ranged lifesteal
              timerSeconds = Math.min(START_TIME_SECONDS + (save.timePurchase || 0), timerSeconds + 0.5);
            }

            if (p.special === 'pierce') {
              p.hitList.push(target.id); // Add to hit list
              // Optionally reduce damage for subsequent targets: dmg *= 0.75;
              return false; // Don't destroy projectile
            }

            return true; // Destroy projectile by default after hitting
          };

          let destroyed = false;

          enemies.slice().forEach(e => {
            if (!destroyed && Math.abs(p.x - e.x) < e.w / 2 + 12 && Math.abs(p.y - e.y) < e.h / 2 + 12) {
              if (processHit(e, false)) destroyed = true;
              if (e.hp <= 0) onEnemyKill(e);
            }
          });
          cyclopses.slice().forEach(c => {
            if (!destroyed && Math.abs(p.x - c.x) < 50 && Math.abs(p.y - c.y) < 50) { // Cyclops hitbox is larger
              if (processHit(c, true)) destroyed = true;
              if (c.hp <= 0) onCyclopsKill(c);
            }
          });

          if (destroyed) projectiles = projectiles.filter(pp => pp !== p);

        } else if (p.owner === 'cyclops') {
          if (Math.abs(p.x - PLAYER.x) < PLAYER.w / 2 + 12 && Math.abs(p.y - PLAYER.y) < PLAYER.h / 2 + 12) {
            const reduction = save.timePenaltyReduction || 0;
            const pen = Math.max(2, Math.round((14) * (1 - reduction)));
            timerSeconds = Math.max(0, timerSeconds - pen);
            if (p.x < PLAYER.x) PLAYER.x += 18; else PLAYER.x -= 18;
            projectiles = projectiles.filter(pp => pp !== p);
            lastEncounterTime = performance.now();
          }
        }
        if (p.life <= 0) projectiles = projectiles.filter(pp => pp !== p);
      });
    }

    function createExplosion(x, y, radius, dmg) {
      // Visual effect
      // We can add a temporary visual object separate from projectiles or just reuse projectiles array with a special type that decays fast
      // Actually simpler to just iterate enemies here.
      enemies.forEach(e => {
        if (Math.hypot(e.x - x, e.y - y) < radius) {
          e.hp -= dmg;
          if (e.hp <= 0) onEnemyKill(e);
        }
      });
      cyclopses.forEach(c => {
        if (Math.hypot(c.x - x, c.y - y) < radius) {
          c.hp -= dmg;
          if (c.hp <= 0) onCyclopsKill(c);
        }
      });
      // Add visual marker for rendering
      projectiles.push({ x, y, life: 10, type: 'explosion', radius, owner: 'visual' });
    }

    // ---------- ON KILL ----------
    function onEnemyKill(e) {
      enemies = enemies.filter(x => x !== e);
      const reward = e.reward || 30;
      awardPoints(Math.max(4, Math.floor(reward / 2)));
      if (Math.random() < 0.14) items.push({ type: 'money', amount: rint(6, 40), x: e.x, y: e.y });
      if (Math.random() < 0.06) items.push({ type: 'dungeon-weapon', name: chooseDungeonWeapon(), x: Math.floor(e.x), claimed: false });
      if (Math.random() < 0.25) timerSeconds = Math.min(timerSeconds + 1, START_TIME_SECONDS + (save.timePurchase || 0));
      lastEncounterTime = performance.now();
    }
    function onCyclopsKill(c) {
      cyclopses = cyclopses.filter(x => x !== c);
      // Guarantee a dungeon weapon on cyclops kill? Or default logic?
      const drops = ['Void Cannon', 'Phoenix Staff', 'Laser Wand', 'Great Axe', 'Necromancer Staff'];
      const name = drops[rint(0, drops.length - 1)];
      items.push({ type: 'dungeon-weapon', name: name, x: Math.floor(c.x), claimed: false });
      awardPoints(80);
      lastEncounterTime = performance.now();
    }

    // ---------- HIT FROM ENEMY ----------
    function enemyHitsPlayer(e) {
      // INVINCIBILITY during dash
      if (PLAYER.dashTimer > 0) return;

      const reduction = save.timePenaltyReduction || 0;
      const pen = Math.max(2, Math.round((e.timePenalty || 7) * (1 - reduction)));
      timerSeconds = Math.max(0, timerSeconds - pen);
      if (e.x < PLAYER.x) e.x -= 18; else e.x += 18;
      lastEncounterTime = performance.now();
    }

    // ---------- CYClops ----------
    function updateCyclopses(dt) {
      const now = performance.now();
      cyclopses.slice().forEach(c => {
        c.facing = (PLAYER.x > c.x) ? 'right' : 'left';
        const dist = Math.hypot(PLAYER.x - c.x, PLAYER.y - c.y);

        const sx = m.x - cameraX;
        if (sx < -300 || sx > canvas.width + 300) return;
        const key = 'scorpion' + (m.facing === 'right' ? 'right' : 'left'); // Reusing scorpion sprite logic
        const img = SPRITES[key];
        if (img && img.complete) {
          ctx.drawImage(img, sx - m.w / 2, m.y - m.h, m.w, m.h);
        } else {
          ctx.fillStyle = '#4ff'; // Blue/Cyan color
          ctx.fillRect(sx - m.w / 2, m.y - m.h, m.w, m.h);
        }
        ctx.fillStyle = '#000'; ctx.fillRect(sx - m.w / 2, m.y - m.h - 8, m.w, 5);
        ctx.fillStyle = '#4ff'; ctx.fillRect(sx - m.w / 2, m.y - m.h - 8, m.w * clamp(m.hp / (m.maxHp || 16), 0, 1), 5);
      });

      // cyclops
      cyclopses.forEach(c => {
        const sx = c.x - cameraX, sy = c.y - 24;
        if (sx < -600 || sx > canvas.width + 600) return;
        c.facing = (PLAYER.x > c.x) ? 'right' : 'left';
        const key = 'cyclops' + (c.facing === 'right' ? 'right' : 'left');
        const img = SPRITES[key];
        const cw = ENEMY_DEFS.Cyclops.w, ch = ENEMY_DEFS.Cyclops.h;
        if (img && img.complete) {
          ctx.drawImage(img, sx - cw / 2, sy - ch / 2, cw, ch);
        } else {
          ctx.fillStyle = '#9a8f8f'; ctx.fillRect(sx - 22, sy - 18, 44, 44);
          ctx.fillStyle = '#ffefef'; ctx.fillRect(sx - 6, sy - 8, 12, 12);
        }
        ctx.fillStyle = '#000'; ctx.fillRect(sx - cw / 2, sy - ch / 2 - 12, cw, 6);
        ctx.fillStyle = '#ff6b6b'; ctx.fillRect(sx - cw / 2, sy - ch / 2 - 12, cw * clamp(c.hp / (c.maxHp || ENEMY_DEFS.Cyclops.hp), 0, 1), 6);

        if (c.state === 'track' && c.target) { ctx.strokeStyle = 'rgba(255,120,120,0.95)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(PLAYER.x - cameraX, PLAYER.y - 8); ctx.stroke(); }
        else if (c.state === 'lock' && c.target) { ctx.strokeStyle = 'rgba(255,40,40,1)'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(c.target.x - cameraX, c.target.y - 8); ctx.stroke(); }
        else if (c.lastFired && performance.now() - c.lastFired < 400) {
          const sxReal = sx, syReal = sy;
          const tx = (c.target ? (c.target.x - cameraX) : (PLAYER.x - cameraX));
          const ty = (c.target ? (c.target.y - 8) : (PLAYER.y - 8));
          ctx.strokeStyle = 'rgba(255,20,20,0.95)'; ctx.lineWidth = 8;
          ctx.beginPath();
          ctx.moveTo(sxReal, syReal);
          const ex = tx + (tx - sxReal) * 6;
          const ey = ty + (ty - syReal) * 6;
          ctx.lineTo(ex, ey);
          ctx.stroke();
        }
      });

      // projectiles
      projectiles.forEach(p => {
        if (p.type === 'explosion') {
          ctx.fillStyle = `rgba(255, 100, 0, ${p.life / 10})`;
          ctx.beginPath();
          ctx.arc(p.x - cameraX, p.y, p.radius || 50, 0, Math.PI * 2);
          ctx.fill();
          p.life--; // Decay visualization
          return;
        }

        if (p.type === 'trail') {
          ctx.save();
          ctx.globalAlpha = 0.4 * (p.life / 10);
          const sx = p.x - cameraX;
          // Use sprite if available
          const img = SPRITES[p.img] || SPRITES['idleright'];
          if (img) ctx.drawImage(img, sx - p.w / 2, p.y - p.h / 2, p.w, p.h);
          else { ctx.fillStyle = '#fff'; ctx.fillRect(sx, p.y, p.w, p.h); }
          ctx.restore();
          p.life--;
          return;
        }

        const sx = p.x - cameraX;
        if (sx < -800 || sx > canvas.width + 800) return;
        if (p.owner === 'player') {
          ctx.fillStyle = p.color || '#fff';
          // Simple graphics as requested:
          // If void cannon, maybe bigger?
          const size = (p.special === 'pierce') ? 12 : 8;
          ctx.fillRect(sx - size / 2, p.y - size / 2, size, size);
        } else if (p.owner === 'cyclops') {
          ctx.fillStyle = '#8b8b8b';
          ctx.fillRect(sx - 10, p.y - 10, 20, 20);
          ctx.fillStyle = 'rgba(0,0,0,0.2)';
          ctx.fillRect(sx - 10, p.y + 10, 20, 3);
        }
      });

      // player
      const screenX = canvas.width / 2;
      const screenY = PLAYER.y - PLAYER.h / 2 + 8;
      const img = SPRITES[(PLAYER.state === 'idle') ? (PLAYER.facing === 'right' ? 'idleright' : 'idleleft') : (PLAYER.state === 'walk' ? (PLAYER.facing === 'right' ? 'jumpwalk1' : 'jumpwalk1left') : (PLAYER.facing === 'right' ? 'jump2' : 'jump2left'))];
      if (img && img.complete) ctx.drawImage(img, screenX - PLAYER.w / 2, screenY - PLAYER.h / 2, PLAYER.w, PLAYER.h);
      else { ctx.fillStyle = '#7dd3fc'; ctx.fillRect(screenX - PLAYER.w / 2, screenY - PLAYER.h / 2, PLAYER.w, PLAYER.h); }

      // draw melee hitbox (if active)
      if (lastMeleeHitbox && performance.now() < lastMeleeHitbox.expiresAt) {
        ctx.save();
        ctx.globalAlpha = 0.28;
        ctx.fillStyle = '#ff4d4d';
        const hx = lastMeleeHitbox.x - cameraX;
        ctx.fillRect(hx, lastMeleeHitbox.y, lastMeleeHitbox.w, lastMeleeHitbox.h);
        ctx.restore();
      } else {
        lastMeleeHitbox = null;
      }

      updateHUD();

      // NEW Inventory Bar
      const invY = canvas.height - 60;
      const invXStart = canvas.width / 2 - ((3 * 64) / 2);

      for (let i = 0; i < 3; i++) {
        const boxX = invXStart + i * 72;
        // Slot
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        if (i === PLAYER.slot) ctx.fillStyle = 'rgba(255,255,255,0.2)';
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 2;
        ctx.fillRect(boxX, invY, 64, 64);
        ctx.strokeRect(boxX, invY, 64, 64);

        // Key binding
        ctx.fillStyle = '#fff'; ctx.font = '12px monospace';
        ctx.fillText(i + 1, boxX + 4, invY + 14);

        // Item
        const item = PLAYER.inventory[i];
        if (item) {
          ctx.font = '10px monospace';
          // Simple text for now, or icon if we have one
          const words = item.name.split(' ');
          const shortName = words[words.length - 1]; // e.g. "Dagger"
          ctx.fillText(shortName, boxX + 4, invY + 32);

          // Rarity color indicator?
          // ctx.fillStyle = getRarityColor(item.name);
        } else {
          ctx.fillStyle = 'rgba(255,255,255,0.3)';
          ctx.fillText('Empty', boxX + 16, invY + 32);
        }
      }
    }

    // ---------- ANIMATION ----------
    setInterval(() => { if (!runActive || paused) return; PLAYER.animTimer++; if (PLAYER.animTimer > 10) { PLAYER.animFrame = (PLAYER.animFrame + 1); PLAYER.animTimer = 0; } }, 1000 / 12);

    // ---------- SHOP UI ----------
    const shopOverlay = document.getElementById('shopOverlay');
    const shopContent = document.getElementById('shopContent');
    const shopClose = document.getElementById('shopClose');
    shopClose.onclick = () => { shopOverlay.style.display = 'none'; shopOverlay.setAttribute('aria-hidden', 'true'); startRun(); };

    function openShopOverlay() {
      shopContent.innerHTML = '';
      const p = document.createElement('div'); p.className = 'muted'; p.innerHTML = `<div style="margin-bottom:8px">Run ended — Points: <strong>${Math.floor(points)}</strong></div>`; shopContent.appendChild(p);

      const title = document.createElement('div'); title.innerHTML = '<strong>Dungeon Weapons</strong>'; shopContent.appendChild(title);

      // Combine discovered dungeon weapons + permWeapons to show everything relevant
      // Actually, we want to show:
      // 1. Unlocked (discovered) but NOT owned -> Buy
      // 2. Owned -> Equip

      const allKnown = [...new Set([...(save.unlockedDungeonWeapons || []), ...(save.permWeapons || [])])];

      // Description map
      const getDesc = (n) => {
        const map = {
          'Crimson Dagger': 'Lifesteal (Heals Time)',
          'Frost Wand': 'Freezes Enemies (Slows)',
          'Phoenix Staff': 'Explosive Area Damage',
          'Void Cannon': 'Pierces Through Enemies',
          'Storm Caller': 'Fires 3 Projectiles',
          'Necromancer Staff': 'Summons Minions',
          'Great Axe': 'High Damage, Slow',
          'Bow': 'Long Range',
          'Laser Wand': 'Very Fast Projectile',
          'Magic Wand': 'Standard Ranged',
          'Fire Staff': 'Medium Ranged'
        };
        return map[n] || 'Standard Weapon';
      };

      const getPrice = (n) => {
        const map = {
          'Necromancer Staff': 3500,
          'Void Cannon': 2500,
          'Phoenix Staff': 2200,
          'Storm Caller': 2000,
          'Frost Wand': 1800,
          'Crimson Dagger': 1500,
          'Laser Wand': 800,
          'Great Axe': 600,
          'Fire Staff': 450,
          'Magic Wand': 300,
          'Bow': 250
        };
        return map[n] || 200;
      };

      if (allKnown.length === 0) {
        const none = document.createElement('div'); none.className = 'muted'; none.textContent = 'You have not discovered weapons yet.'; shopContent.appendChild(none);
      } else {
        // Current loadout
        const loadoutDiv = document.createElement('div');
        loadoutDiv.style.marginBottom = '10px';
        loadoutDiv.style.padding = '8px';
        loadoutDiv.style.backgroundColor = 'rgba(0,0,0,0.3)';
        loadoutDiv.innerHTML = `<strong>Current Loadout (${(save.loadout || []).length}/3):</strong> ${(save.loadout || []).join(', ') || 'None'}`;
        shopContent.appendChild(loadoutDiv);

        allKnown.forEach(w => {
          const row = document.createElement('div'); row.className = 'shop-row';
          const owned = (save.permWeapons || []).includes(w);
          const isSelected = (save.loadout || []).includes(w);
          const desc = getDesc(w);
          const price = getPrice(w);

          let actionHtml = '';
          if (owned) {
            if (isSelected) {
              actionHtml = `<button class="btn toggleW" data-w="${w}" style="background:#7dd3fc;color:#000">Selected</button>`;
            } else {
              actionHtml = `<button class="btn toggleW" data-w="${w}" style="background:#2b6b3a">Equip</button>`;
            }
          } else {
            // Check if can afford
            const affordable = points >= price;
            const btnStyle = affordable ? '' : 'background:#555;color:#aaa;cursor:not-allowed';
            actionHtml = `<strong>${price}</strong> <button class="btn buyW" data-w="${w}" style="${btnStyle}">Buy</button>`;
          }

          row.innerHTML = `<div><div style="font-weight:bold">${w}</div><div style="font-size:12px;color:#aaa">${desc}</div></div><div>${actionHtml}</div>`;
          shopContent.appendChild(row);
        });
      }

      const upTitle = document.createElement('div'); upTitle.style.marginTop = '8px'; upTitle.innerHTML = '<strong>Permanent Upgrades & Time</strong>'; shopContent.appendChild(upTitle);

      // Speed
      const spd = document.createElement('div'); spd.className = 'shop-row';
      spd.innerHTML = `<div>+0.5 Speed ${save.permSpeed > 0 ? ` (x${1 + save.permSpeed / 0.5})` : ''}</div><div><strong>100</strong> <button id="buySpeed" class="btn" ${save.permSpeed >= 3 ? 'disabled' : ''}>Buy</button></div>`;
      shopContent.appendChild(spd);

      // Penalty Reduction
      const pen = document.createElement('div'); pen.className = 'shop-row';
      pen.innerHTML = `<div>Reduce hit penalty (5%) ${save.timePenaltyReduction > 0 ? `(+${Math.round(save.timePenaltyReduction * 100)}%)` : ''}</div><div><strong>120</strong> <button id="buyPenalty" class="btn" ${save.timePenaltyReduction >= 0.25 ? 'disabled' : ''}>Buy</button></div>`;
      shopContent.appendChild(pen);

      // Jumps
      const hasDouble = (save.permWeapons || []).includes('Double Jump');
      const hasTriple = (save.permWeapons || []).includes('Triple Jump');

      const jumpRow = document.createElement('div'); jumpRow.className = 'shop-row';
      let jumpBtn = '';
      if (hasTriple) jumpBtn = '<span style="color:#7dd3fc">Triple Jump Owned</span>';
      else if (hasDouble) jumpBtn = '<strong>7000</strong> <button id="buyTriple" class="btn">Buy Triple Jump</button>';
      else jumpBtn = '<strong>3000</strong> <button id="buyDouble" class="btn">Buy Double Jump</button>';

      jumpRow.innerHTML = `<div>Jump Upgrade</div><div>${jumpBtn}</div>`;
      shopContent.appendChild(jumpRow);

      // Golden Ticket
      const hasTicket = (save.permWeapons || []).includes('Golden Ticket');
      const ticketRow = document.createElement('div'); ticketRow.className = 'shop-row';
      ticketRow.innerHTML = `<div>Golden Ticket (Premium Status)</div><div>${hasTicket ? '<span style="color:#ffd700">Owned</span>' : '<strong>50000</strong> <button id="buyTicket" class="btn">Buy</button>'}</div>`;
      shopContent.appendChild(ticketRow);

      // Time Purchases
      const timeDiv = document.createElement('div');
      timeDiv.style.marginTop = '10px';

      const getMinutePrice = (count) => {
        if (count === 0) return 1000;
        if (count === 1) return 3000;
        if (count === 2) return 5000;
        return 10000;
      };

      const nextTimePrice = getMinutePrice(save.timePurchaseCount || 0);

      timeDiv.innerHTML = `<div><strong>Buy Time (Current Bonus: ${Math.round((save.timePurchase || 0) / 60)}m)</strong></div>`;
      timeDiv.innerHTML += `<div style="display:flex;gap:4px;flex-wrap:wrap;justify-content:space-between;margin-top:4px">
        <button class="btn buyTime" data-cost="${nextTimePrice}">Buy 1 Minute (${nextTimePrice} pts)</button>
      </div>`;
      shopContent.appendChild(timeDiv);

      // button logic
      shopContent.querySelectorAll('.buyW').forEach(b => {
        b.onclick = () => {
          const name = b.dataset.w;
          const price = getPrice(name);
          if (points >= price) {
            points -= price; save.points = points;
            if (!save.permWeapons.includes(name)) save.permWeapons.push(name);
            // Auto equip if has space
            if ((save.loadout || []).length < 3) {
              if (!save.loadout) save.loadout = [];
              save.loadout.push(name);
            }
            openShopOverlay();
          } else alert('Not enough points');
        };
      });
      shopContent.querySelectorAll('.toggleW').forEach(b => {
        b.onclick = () => {
          const name = b.dataset.w;
          if (!save.loadout) save.loadout = []; // Ensure loadout exists
          if (save.loadout.includes(name)) {
            save.loadout = save.loadout.filter(x => x !== name);
          } else {
            if (save.loadout.length >= 3) { alert('Max 3 items equipped. Deselect one first.'); return; }
            save.loadout.push(name);
          }
          openShopOverlay();
        };
      });

      document.getElementById('buySpeed').onclick = () => { if (points >= 100) { points -= 100; save.points = points; save.permSpeed = (save.permSpeed || 0) + 0.5; openShopOverlay(); } else alert('Not enough points'); };
      document.getElementById('buyPenalty').onclick = () => { if (points >= 120) { points -= 120; save.points = points; save.timePenaltyReduction = (save.timePenaltyReduction || 0) + 0.05; openShopOverlay(); } else alert('Not enough points'); };

      const btnDouble = document.getElementById('buyDouble');
      if (btnDouble) btnDouble.onclick = () => {
        if (points >= 3000) { points -= 3000; save.points = points; save.permWeapons.push('Double Jump'); openShopOverlay(); } else alert('Not enough points');
      };
      const btnTriple = document.getElementById('buyTriple');
      if (btnTriple) btnTriple.onclick = () => {
        if (points >= 7000) { points -= 7000; save.points = points; save.permWeapons.push('Triple Jump'); openShopOverlay(); } else alert('Not enough points');
      };

      const btnTicket = document.getElementById('buyTicket');
      if (btnTicket) btnTicket.onclick = () => {
        if (points >= 50000) { points -= 50000; save.points = points; save.permWeapons.push('Golden Ticket'); openShopOverlay(); } else alert('Not enough points');
      };

      shopContent.querySelectorAll('.buyTime').forEach(b => {
        b.onclick = () => {
          const cost = parseInt(b.dataset.cost);
          if (points >= cost) {
            if (((save.timePurchase || 0) + 60) <= (MAX_TIME_SECONDS - START_TIME_SECONDS)) {
              points -= cost;
              save.points = points;
              save.timePurchase = (save.timePurchase || 0) + 60;
              save.timePurchaseCount = (save.timePurchaseCount || 0) + 1;
              openShopOverlay();
            } else alert('Cannot buy more time (max reached).');
          } else alert('Not enough points');
        };
      });

      shopOverlay.style.display = 'block';
      shopOverlay.setAttribute('aria-hidden', 'false');
    }

    // ---------- RUN CONTROL ----------
    function startRun() {
      terrain = []; platforms = []; dungeons = []; enemies = []; cyclopses = []; items = []; projectiles = []; chunks = []; minions = [];
      generatedXEnd = 0; generatedXStart = 0;
      PLAYER.x = 500; PLAYER.y = canvas.height - 160; PLAYER.vy = 0; PLAYER.onGround = true;

      // Jumps
      PLAYER.maxJumps = 1;
      if ((save.permWeapons || []).includes('Triple Jump')) PLAYER.maxJumps = 3;
      else if ((save.permWeapons || []).includes('Double Jump')) PLAYER.maxJumps = 2;
      PLAYER.jumpsLeft = PLAYER.maxJumps;

      // Load Inventory from Loadout
      PLAYER.inventory = [];
      if (save.loadout && save.loadout.length > 0) {
        save.loadout.forEach(wName => {
          PLAYER.inventory.push({ name: wName, type: 'weapon' });
        });
      }
      PLAYER.slot = 0;
      PLAYER.dashTimer = 0; PLAYER.dashCooldown = 0;

      // FIX: Reset Game State
      gameState = 'world';
      worldState = null;

      points = save.points || 0;
      timerSeconds = START_TIME_SECONDS + (save.timePurchase || 0);
      runActive = true; paused = false; lastEncounterTime = performance.now();
      save.runs = (save.runs || 0);
      ensureTerrainAroundCamera();
      startTimerTick();
      lastRAF = performance.now();
      requestAnimationFrame(raf);
    }

    function endRun() {
      runActive = false;
      if (timerTickInterval) clearInterval(timerTickInterval);
      save.runs = (save.runs || 0) + 1;
      // Distance bonus
      const distPoints = Math.floor(Math.abs(PLAYER.x) / 50); // 1 pt per 50px
      points += distPoints;
      save.points = points;
      openShopOverlay();
    }

    // ---------- HELPERS ----------
    function spawnCyclopsNear(xMin, xMax) {
      spawnCyclopsAt(PLAYER.x + rint(xMin, xMax), sampleTerrainY(PLAYER.x + rint(xMin, xMax)) - 60, false);
    }

    // ---------- HUD ----------
    const hudDiv = document.getElementById('hud');
    function updateHUD() {
      const remaining = Math.max(0, Math.floor(timerSeconds));
      const dist = Math.floor(Math.abs(PLAYER.x));
      const dashStatus = (PLAYER.dashCooldown || 0) <= 0 ? 'READY (F+G / Shift)' : Math.ceil((PLAYER.dashCooldown || 0) / 60) + 's';
      hudDiv.textContent =
        `Pts: ${Math.floor(points)}\n` +
        `Dist: ${dist} px\n` +
        `Time: ${fmtTime(remaining)}\n` +
        `Dash: ${dashStatus}\n` +
        `Runs: ${save.runs || 0}`;
    }

    // ---------- BOOTSTRAP ----------
    function init() {
      ensureTerrainAroundCamera();
      updateHUD();
      startRun();
    }
    init();

    // Expose debug helpers (session-only)
    window._save = save;
    window._spawnCyclopsNear = spawnCyclopsNear;
  </script>
</body>

</html>
